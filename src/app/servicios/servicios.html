<h2>Servicios</h2>

<div class="catalogo">
  @for (s of servicios; track s.id) {
    <div class="servicio">
      <div class="icono">🦷</div>
      <h3>{{ s.nombre }}</h3>
      <p class="descripcion">{{ s.descripcion }}</p>
      <p class="precio">{{ s.precio | currency:'RD$ ':'symbol':'1.0-0' }}</p>
    </div>
  }
</div>
